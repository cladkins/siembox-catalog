name: validate-catalog

# Gate every submission. Each portable parser must pass strict schema validation
# AND its own self-tests, run through the real SIEMBox parse -> derive -> normalize
# pipeline; detections are validated against what the rules engine actually
# supports; content packs are validated and their references resolved;
# application signatures and suggested scans are validated. Parser regexes
# added or changed in the PR are also ReDoS-scanned.
#
# This workflow runs on EVERY PR to main (no path filter) so it can always report
# status and is therefore safe to mark as a required branch-protection check.
# The expensive build + validate steps run only when catalog content or schema
# files actually change; otherwise the job no-ops to green in seconds.
#
# Security posture: this uses `pull_request` (NOT `pull_request_target`), so fork
# PRs run with a read-only token and no access to repo secrets. The validator is
# built from the trusted cladkins/siembox repo, never from the PR, so a fork
# cannot alter validation logic. Third-party actions are pinned to commit SHAs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the validator to a known-good SIEMBox ref; bump to upgrade the engine.
  SIEMBOX_REF: main

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalog (PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          # Full history so we can diff against the PR base commit.
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        working-directory: catalog
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "parsers_changed=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: validating the entire catalog."
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD -- parsers detections packs applications scans schema || true)"
          if [ -n "$CHANGED" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Catalog content changes detected:"; echo "$CHANGED"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No parser/detection/pack/application/scan/schema changes; validation steps skipped."
          fi
          PARSERS="$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- parsers | grep '\.parser\.json$' || true)"
          if [ -n "$PARSERS" ]; then
            echo "parsers_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "parsers_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ReDoS pre-scan (changed parser regexes)
        if: steps.changes.outputs.parsers_changed == 'true'
        working-directory: catalog
        env:
          # Only parsers added/modified in this PR are gated; pre-existing
          # parsers are grandfathered for a dedicated cleanup PR.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install recheck@4 --no-save --no-audit --no-fund
          node .github/scripts/redos-scan.mjs

      - name: Duplicate-name check (parsers + detections)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: catalog
        run: |
          npm install js-yaml --no-save --no-audit --no-fund
          node .github/scripts/duplication-check.mjs

      - name: Checkout validator (trusted SIEMBox)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cladkins/siembox
          ref: ${{ env.SIEMBOX_REF }}
          path: siembox

      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siembox/backend/package-lock.json

      - name: Build validator
        if: steps.changes.outputs.relevant == 'true'
        working-directory: siembox/backend
        run: npm ci && npm run build

      - name: Validate parsers (strict + self-tests)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: siembox/backend
        run: npm run validate-parsers -- "$GITHUB_WORKSPACE/catalog/parsers"

      - name: Validate detections (strict)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: siembox/backend
        run: |
          DET="$GITHUB_WORKSPACE/catalog/detections"
          if [ -d "$DET" ] && find "$DET" -name '*.yaml' -print -quit | grep -q .; then
            npm run validate-detections -- "$DET"
          else
            echo "No detections to validate."
          fi

      # Content packs: strict schema, ids unique and matching file names, every
      # referenced parser / detection selector resolves against this catalog,
      # Sigma ids are UUIDs, guide size caps, and no raw HTML, images or unsafe
      # links in the guide markdown. Needs SIEMBox with `validate-packs`.
      - name: Validate content packs (strict, references resolve)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: siembox/backend
        run: |
          PACKS="$GITHUB_WORKSPACE/catalog/packs"
          if [ -d "$PACKS" ] && find "$PACKS" -name '*.pack.yaml' -print -quit | grep -q .; then
            npm run validate-packs -- "$PACKS" \
              --parsers "$GITHUB_WORKSPACE/catalog/parsers" \
              --detections "$GITHUB_WORKSPACE/catalog/detections"
          else
            echo "No packs to validate."
          fi

      # Application signatures: strict schema, ids unique and matching file
      # names, no matcher value claimed twice, every referenced parser exists in
      # this catalog, every regex passes the ReDoS gate (recheck, as for
      # parsers and rules), and every signature's tests pass against the whole
      # set. Needs SIEMBox with `validate-applications`.
      - name: Validate application signatures (strict, ReDoS, self-tests)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: siembox/backend
        run: |
          APPS="$GITHUB_WORKSPACE/catalog/applications"
          if [ -d "$APPS" ] && find "$APPS" -name '*.app.yaml' -print -quit | grep -q .; then
            npm run validate-applications -- "$APPS" --parsers "$GITHUB_WORKSPACE/catalog/parsers"
          else
            echo "No application signatures to validate."
          fi

      # Suggested scans: strict schema, ids and names unique and matching file
      # names, a valid calendar schedule without a time zone, options the
      # Scheduled Scans and scan-policy routes accept, every required input
      # listed, no concrete target (no IP, CIDR or host name in options or
      # inputs), and intrusive Nuclei selections declared intrusive. Needs
      # SIEMBox with `validate-scans`.
      - name: Validate suggested scans (strict, schedules, no concrete targets)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: siembox/backend
        run: |
          SCANS="$GITHUB_WORKSPACE/catalog/scans"
          if [ -d "$SCANS" ] && find "$SCANS" -name '*.scan.yaml' -print -quit | grep -q .; then
            npm run validate-scans -- "$SCANS"
          else
            echo "No suggested scans to validate."
          fi
